name: money_movement

on:
  push:
    branches: [dev-money-mv]

jobs:
  money_movement_test_build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: money_movement

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: money_movement/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
