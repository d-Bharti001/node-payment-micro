syntax = "proto3";

package auth;

service AuthService {
    rpc LoginUser(Credentials) returns (Token) {}
    rpc ValidateToken(Token) returns (User) {}
}

message Token {
    string jwt = 1;
}

message Credentials {
    string user_id = 1;
    string password = 2;
}

message User {
    int32 seq_id = 1;
    string user_id = 2;
}
