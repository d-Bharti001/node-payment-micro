apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: dbharti001/auth-nodejs:1.0.0
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-credentials
            - configMapRef:
                name: auth-mysql-config
            - secretRef:
                name: auth-mysql-credentials
