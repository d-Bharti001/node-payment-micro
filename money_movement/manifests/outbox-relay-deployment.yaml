apiVersion: apps/v1
kind: Deployment
metadata:
  name: money-movement-outbox-relay
  labels:
    app: money-movement-outbox-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: money-movement-outbox-relay
  template:
    metadata:
      labels:
        app: money-movement-outbox-relay
    spec:
      containers:
        - name: money-movement-outbox-relay
          image: dbharti001/money-movement-nodejs:1.0.0
          command: ["node", "build/src/outbox/index.js"]
          envFrom:
            - configMapRef:
                name: money-movement-config
            - configMapRef:
                name: money-movement-mysql-config
            - secretRef:
                name: money-movement-mysql-credentials
